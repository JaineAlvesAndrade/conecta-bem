<div class="auth-container">
  <div class="auth-card">
    <ng-container *ngIf="view === 'forgot-success' && state !== 'success'">
      <header>
        <img src="/assets/logo.png" alt="ConectaBem" class="logo">
        <h2>Verifique seu e-mail</h2>
        <p>
          Se existe uma conta com esse endereço, você receberá
          uma nova senha em instantes.
        </p>
      </header>
      <button class="btn-primary" (click)="goToLogin()">Voltar para o login</button>
    </ng-container>

    <ng-container *ngIf="view === 'forgot' && state !== 'success'">
      <header>
        <img src="/assets/logo.png" alt="ConectaBem" class="logo">
        <h2>Esqueci minha senha</h2>
        <p>Informe seu e-mail e enviaremos uma nova senha para você.</p>
        <div class="error" *ngIf="state === 'error'">{{ errorMessage }}</div>
      </header>

      <form (submit)="onForgotSubmit()">
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="forgotEmail" name="forgotEmail" required>
        </div>

        <button type="submit" class="btn-primary" [disabled]="state === 'loading' || !forgotEmail">
          <span *ngIf="state !== 'loading'">Enviar nova senha</span>
          <span *ngIf="state === 'loading'">Aguarde...</span>
        </button>
      </form>

      <footer>
        <a (click)="goToLogin()">Voltar para login</a>
      </footer>
    </ng-container>
  </div>
</div>
